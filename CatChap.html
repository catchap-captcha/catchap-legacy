기면 안 된다.`,correct:!1,rationale:`일부만 맞아요. 음식 규칙은 맞지만 줄서기나 식판 정리 규칙까지는 담지 못해요.`},{text:`급식 시간은 규칙이 없어서 자유롭게 행동해도 된다.`,correct:!1,rationale:`다른 방향이에요. 지문은 지켜야 할 규칙이 있다는 이야기인데, 이 문장은 정반대로 말하고 있어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-006`,difficulty:`easy`,paragraph:`나뭇잎이 붉은색이나 노란색으로 물든다. 열매가 익어서 떨어진다. 바람이 불면 잎이 우수수 떨어진다. 가을이 되면 나무에 여러 변화가 생긴다.`,prompt:`이 글의 중심 문장으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`가을이 되면 나무에 여러 변화가 생긴다.`,correct:!0,rationale:`정답이에요! 잎 색깔, 열매, 낙엽까지 가을에 나무가 겪는 여러 변화를 모두 담은 문장이에요.`},{text:`열매가 익어서 떨어진다.`,correct:!1,rationale:`너무 좁아요. 열매 이야기만 담고 있어서 잎 색깔이나 낙엽 이야기는 빠져 있어요.`},{text:`가을이 되면 나뭇잎 색깔이 변한다.`,correct:!1,rationale:`일부만 맞아요. 색깔 변화는 맞지만 열매나 낙엽 이야기까지는 담지 못해요.`},{text:`가을은 나무가 겨울을 준비하는 계절이다.`,correct:!1,rationale:`다른 방향이에요. 그럴듯하게 들리지만 지문에는 나오지 않는 다른 결론이에요.`}]},{type:`main_idea`,id:`KOR4-MAIN-007`,difficulty:`easy`,paragraph:`양치할 때 컵을 사용한다. 샤워 시간을 줄인다. 세탁물을 모아서 한 번에 빨래한다. 물을 아껴 쓰는 방법은 여러 가지가 있다.`,prompt:`이 글의 중심 문장으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`물을 아껴 쓰는 방법은 여러 가지가 있다.`,correct:!0,rationale:`정답이에요! 컵 사용, 샤워 시간 단축, 세탁물 모으기까지 세 가지 방법을 모두 아우르는 문장이에요.`},{text:`양치할 때 컵을 사용한다.`,correct:!1,rationale:`너무 좁아요. 이건 물을 아끼는 여러 방법 중 하나일 뿐이에요.`},{text:`샤워 시간을 줄이면 물을 절약할 수 있다.`,correct:!1,rationale:`일부만 맞아요. 샤워 이야기는 맞지만 컵 사용이나 세탁물 모으기까지는 담지 못해요.`},{text:`물을 아끼는 일은 누구에게나 어렵다.`,correct:!1,rationale:`다른 방향이에요. 지문은 '방법이 여러 가지 있다'는 이야기이지 '어렵다'는 이야기가 아니에요.`}]},{type:`main_idea`,id:`KOR4-MAIN-008`,difficulty:`easy`,paragraph:`우리 가족은 주말마다 특별한 활동을 한다. 토요일 아침에는 함께 자전거를 탄다. 토요일 저녁에는 보드게임을 한다. 일요일에는 다 같이 요리를 만든다.`,prompt:`이 글의 중심 문장으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`우리 가족은 주말마다 특별한 활동을 한다.`,correct:!0,rationale:`정답이에요! 자전거, 보드게임, 요리까지 주말에 하는 여러 활동을 모두 아우르는 문장이에요.`},{text:`토요일 아침에는 함께 자전거를 탄다.`,correct:!1,rationale:`너무 좁아요. 토요일 아침 활동만 담고 있어서 저녁이나 일요일 이야기는 빠져 있어요.`},{text:`우리 가족은 토요일마다 함께 시간을 보낸다.`,correct:!1,rationale:`일부만 맞아요. 토요일 이야기는 맞지만 일요일 요리 이야기까지는 담지 못해요.`},{text:`우리 가족은 주말에 각자 따로 시간을 보낸다.`,correct:!1,rationale:`다른 방향이에요. 지문은 가족이 함께 활동한다는 이야기인데, 이 문장은 정반대로 말하고 있어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-009`,difficulty:`medium`,paragraph:`민수는 매일 아침 30분씩 책을 읽는다. 처음에는 지루했지만 이제는 다양한 이야기를 알게 되어 즐겁다. 모르는 낱말도 많이 배워서 글쓰기에도 도움이 되었다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`꾸준히 책을 읽으면 여러 가지 도움이 된다.`,correct:!0,rationale:`정답이에요! 즐거움을 느낀 것과 낱말을 배운 것, 두 가지 도움을 모두 담은 문장이에요.`},{text:`민수는 아침에 일찍 일어난다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요. 몇 시에 일어나는지는 나와 있지 않아요.`},{text:`책은 항상 지루하다.`,correct:!1,rationale:`지문과 반대예요. 처음엔 지루했지만 지금은 즐겁다고 했어요.`},{text:`글쓰기는 어려운 일이다.`,correct:!1,rationale:`지문의 일부만 보고 만든 문장이에요. 글쓰기에 도움이 됐다는 말이지 어렵다는 말은 아니에요.`}]},{type:`main_idea`,id:`KOR4-MAIN-010`,difficulty:`medium`,paragraph:`쓰레기를 함부로 버리면 강과 바다가 더러워진다. 물이 더러워지면 물고기와 여러 생물이 살기 어려워진다. 결국 그 피해는 다시 우리에게 돌아온다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`쓰레기를 함부로 버리면 결국 우리에게도 나쁜 영향이 온다.`,correct:!0,rationale:`정답이에요! 바다 오염 → 생물 피해 → 우리에게 돌아오는 피해까지 전체 흐름을 담은 문장이에요.`},{text:`강에는 물고기가 많이 산다.`,correct:!1,rationale:`지문의 결론이 아니라 배경 설명 중 일부일 뿐이에요.`},{text:`바다는 매우 넓다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요.`},{text:`쓰레기통은 자주 비워야 한다.`,correct:!1,rationale:`지문과 다른 이야기예요. 지문은 쓰레기를 함부로 버리지 말자는 내용이지 쓰레기통 관리 이야기가 아니에요.`}]},{type:`main_idea`,id:`KOR4-MAIN-011`,difficulty:`medium`,paragraph:`발표를 잘하려면 먼저 내용을 충분히 이해해야 한다. 그리고 큰 소리로 또박또박 말하는 연습을 해야 한다. 마지막으로 듣는 사람과 눈을 맞추며 이야기하면 더 자신 있게 보인다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`발표를 잘하려면 준비와 연습이 필요하다.`,correct:!0,rationale:`정답이에요! 내용 이해, 말하기 연습, 눈 맞추기까지 발표 준비 과정을 모두 담은 문장이에요.`},{text:`발표는 누구나 쉽게 할 수 있다.`,correct:!1,rationale:`지문과 반대예요. 지문은 준비와 연습이 필요하다는 이야기예요.`},{text:`눈을 맞추면 눈이 아프다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요.`},{text:`큰 소리로 말하면 목이 아프다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요.`}]},{type:`main_idea`,id:`KOR4-MAIN-012`,difficulty:`medium`,paragraph:`식물은 햇빛과 물, 알맞은 온도가 있어야 잘 자란다. 햇빛이 부족하면 잎이 시들고, 물이 부족하면 뿌리가 마른다. 온도가 너무 낮으면 자라는 속도가 느려진다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`식물이 잘 자라려면 여러 조건이 알맞게 갖추어져야 한다.`,correct:!0,rationale:`정답이에요! 햇빛, 물, 온도까지 세 가지 조건을 모두 담은 문장이에요.`},{text:`식물은 물만 있으면 자란다.`,correct:!1,rationale:`일부만 맞아요. 물 이야기만 담고 있어서 햇빛이나 온도 이야기는 빠져 있어요.`},{text:`잎이 시들면 물을 너무 많이 준 것이다.`,correct:!1,rationale:`지문과 반대예요. 잎이 시드는 건 햇빛이 부족해서라고 했어요.`},{text:`온도는 식물의 성장에 영향을 주지 않는다.`,correct:!1,rationale:`지문과 반대예요. 온도가 낮으면 자라는 속도가 느려진다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-013`,difficulty:`medium`,paragraph:`친구와 다투었을 때는 자신의 마음을 솔직하게 말하는 것이 중요하다. 화가 났다고 소리를 지르거나 물건을 던지면 사이가 더 나빠진다. 차분하게 이야기하면 오해를 풀 수 있다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`친구와 다투었을 때는 차분하고 솔직하게 대화하는 것이 좋다.`,correct:!0,rationale:`정답이에요! 솔직하게 말하기와 차분하게 이야기하기, 두 가지를 모두 담은 문장이에요.`},{text:`친구와는 절대 다투면 안 된다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요. 다투지 말자는 게 아니라 다퉜을 때 어떻게 하면 좋을지 이야기하고 있어요.`},{text:`화가 나면 큰 소리를 내야 풀린다.`,correct:!1,rationale:`지문과 반대예요. 소리 지르면 사이가 더 나빠진다고 했어요.`},{text:`오해는 시간이 지나도 풀리지 않는다.`,correct:!1,rationale:`지문과 반대예요. 차분하게 이야기하면 오해를 풀 수 있다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-014`,difficulty:`medium`,paragraph:`규칙적으로 자고 일어나는 습관은 건강에 큰 도움이 된다. 잠이 부족하면 낮에 집중하기 어렵고 쉽게 피곤해진다. 반면 충분히 자면 몸과 마음이 상쾌해진다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`규칙적인 수면 습관은 건강에 도움이 된다.`,correct:!0,rationale:`정답이에요! 잠이 부족할 때와 충분할 때를 비교해서 얻은 결론이에요.`},{text:`잠은 많이 잘수록 좋다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요. '규칙적으로' 자는 것이 중요하다고 했지 많이 잘수록 좋다는 말은 아니에요.`},{text:`낮에는 절대 피곤하면 안 된다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요.`},{text:`수면과 건강은 관련이 없다.`,correct:!1,rationale:`지문과 정반대예요.`}]},{type:`main_idea`,id:`KOR4-MAIN-015`,difficulty:`medium`,paragraph:`박물관에 가면 옛날 사람들이 쓰던 물건을 직접 볼 수 있다. 설명을 들으며 그 시대의 생활 모습도 알 수 있다. 책에서 배운 내용을 눈으로 확인하니 더 오래 기억에 남는다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`박물관 방문은 역사를 배우는 데 도움이 된다.`,correct:!0,rationale:`정답이에요! 물건 보기, 설명 듣기, 기억에 남기까지 박물관의 좋은 점을 모두 담은 문장이에요.`},{text:`박물관은 항상 무료로 이용할 수 있다.`,correct:!1,rationale:`지문에 나오지 않는 이야기예요.`},{text:`박물관에는 그림만 전시되어 있다.`,correct:!1,rationale:`지문과 달라요. 옛날 사람들이 쓰던 물건을 볼 수 있다고 했어요.`},{text:`책으로 배우는 것이 더 효과적이다.`,correct:!1,rationale:`지문과 반대예요. 눈으로 직접 보니 더 오래 기억에 남는다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-016`,difficulty:`medium`,paragraph:`동물원에서는 동물들이 살기 좋은 환경을 만들어 주려고 노력한다. 각 동물에게 맞는 먹이와 온도를 맞춰 준다. 아프거나 다친 동물은 따로 치료를 받는다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`동물원은 동물들이 건강하게 지낼 수 있도록 신경 쓴다.`,correct:!0,rationale:`정답이에요! 환경, 먹이·온도, 치료까지 동물원의 노력을 모두 담은 문장이에요.`},{text:`동물원의 동물들은 스스로 먹이를 구한다.`,correct:!1,rationale:`지문과 반대예요. 동물원이 맞는 먹이를 맞춰 준다고 했어요.`},{text:`동물원에는 다친 동물이 없다.`,correct:!1,rationale:`지문과 달라요. 아프거나 다친 동물은 따로 치료를 받는다고 했으니, 다친 동물이 있을 수 있다는 뜻이에요.`},{text:`모든 동물은 같은 환경에서 지낸다.`,correct:!1,rationale:`지문과 반대예요. 각 동물에게 맞는 환경을 만들어 준다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-017`,difficulty:`medium`,paragraph:`여행을 가기 전에 미리 계획을 세우면 좋은 점이 많다. 가고 싶은 곳을 정리하면 시간을 아낄 수 있다. 준비물을 미리 챙기면 빠뜨리는 것이 줄어든다.`,prompt:`이 글의 중심 생각으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`여행 전에 계획을 세우면 여러 가지로 도움이 된다.`,correct:!0,rationale:`정답이에요! 시간 절약과 준비물 챙기기, 두 가지 도움을 모두 담은 문장이에요.`},{text:`여행은 계획 없이 가야 더 재미있다.`,correct:!1,rationale:`지문과 반대예요.`},{text:`준비물은 여행지에서 사면 된다.`,correct:!1,rationale:`지문과 반대예요. 미리 챙기면 빠뜨리는 게 줄어든다고 했어요.`},{text:`여행 계획은 시간이 오래 걸려서 필요 없다.`,correct:!1,rationale:`지문과 반대예요. 계획을 세우면 오히려 시간을 아낄 수 있다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-018`,difficulty:`hard`,paragraph:`아침에 늦잠을 자서 서둘러 집을 나섰다. 버스를 놓쳐서 다음 버스를 한참 기다려야 했다. 결국 학교에 십 분이나 늦게 도착했다.`,prompt:`이 글을 한 문장으로 요약한 것으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`늦잠을 자서 버스를 놓쳤고, 그 결과 학교에 늦었다.`,correct:!0,rationale:`정답이에요! 늦잠을 잔 원인과 학교에 지각한 결과까지 모두 이어서 담은 요약이에요.`},{text:`버스를 놓쳐서 한참을 기다렸다.`,correct:!1,rationale:`너무 좁아요. 버스를 기다린 사건 하나만 담고 있어서 전체 이야기를 담지 못해요.`},{text:`아침에 늦잠을 자서 서둘러 집을 나섰다.`,correct:!1,rationale:`일부만 맞아요. 늦잠을 잔 이야기는 맞지만, 그래서 어떻게 됐는지 결과는 담지 못했어요.`},{text:`버스를 놓쳐도 지각하지 않을 수 있다.`,correct:!1,rationale:`다른 방향이에요. 지문에서는 실제로 학교에 늦었다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-019`,difficulty:`hard`,paragraph:`미나는 그림 그리기를 좋아해서 매일 연습했다. 처음에는 그림이 어설펐지만 점점 실력이 좋아졌다. 결국 미술 대회에서 상을 받았다.`,prompt:`이 글을 한 문장으로 요약한 것으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`미나는 꾸준히 그림을 연습해서 미술 대회에서 상을 받았다.`,correct:!0,rationale:`정답이에요! 꾸준한 연습과 상을 받은 결과까지 이어지는 이야기를 모두 담은 요약이에요.`},{text:`미나는 처음에 그림을 어설프게 그렸다.`,correct:!1,rationale:`너무 좁아요. 처음 모습 하나만 담고 있어서 그 뒤 이야기는 빠져 있어요.`},{text:`미나는 매일 그림 연습을 했다.`,correct:!1,rationale:`일부만 맞아요. 연습한 이야기는 맞지만 상을 받은 결과까지는 담지 못했어요.`},{text:`그림 실력은 타고나야만 늘 수 있다.`,correct:!1,rationale:`다른 방향이에요. 지문은 오히려 꾸준한 노력으로 실력이 늘었다는 이야기예요.`}]},{type:`main_idea`,id:`KOR4-MAIN-020`,difficulty:`hard`,paragraph:`공장에서 나오는 매연과 자동차의 배기가스는 공기를 오염시킨다. 오염된 공기는 사람들의 호흡기 건강을 나쁘게 한다. 그래서 여러 나라가 배기가스를 줄이는 정책을 만들고 있다.`,prompt:`이 글을 한 문장으로 요약한 것으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`매연과 배기가스로 인한 공기 오염을 줄이려고 여러 나라가 노력하고 있다.`,correct:!0,rationale:`정답이에요! 오염의 원인과 여러 나라의 대응까지 모두 담은 요약이에요.`},{text:`매연과 배기가스는 공기를 오염시킨다.`,correct:!1,rationale:`너무 좁아요. 오염의 원인만 담고 있어서 각 나라의 대응은 빠져 있어요.`},{text:`오염된 공기는 사람들의 건강에 나쁜 영향을 준다.`,correct:!1,rationale:`일부만 맞아요. 건강에 미치는 영향은 담았지만 나라들의 대응 노력까지는 담지 못했어요.`},{text:`공기 오염 문제는 해결할 방법이 없다.`,correct:!1,rationale:`다른 방향이에요. 지문은 여러 나라가 해결하려고 노력하고 있다는 이야기예요.`}]},{type:`main_idea`,id:`KOR4-MAIN-021`,difficulty:`hard`,paragraph:`재호는 축구 경기에서 실수로 공을 놓쳐 팀이 골을 먹었다. 친구들은 재호를 탓하지 않고 오히려 힘내라고 응원해 주었다. 재호는 그 뒤로 더 열심히 뛰었고, 그 덕분에 팀이 승리했다.`,prompt:`이 글을 한 문장으로 요약한 것으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`실수한 재호를 친구들이 응원해 주었고, 재호는 더 열심히 뛰어 팀이 승리했다.`,correct:!0,rationale:`정답이에요! 친구들의 응원과 그 결과 얻은 승리까지 이어서 담은 요약이에요.`},{text:`재호는 실수로 공을 놓쳐 팀이 골을 먹었다.`,correct:!1,rationale:`너무 좁아요. 실수한 장면 하나만 담고 있어서 이후 이야기는 빠져 있어요.`},{text:`친구들은 실수한 재호를 탓하지 않고 응원해 주었다.`,correct:!1,rationale:`일부만 맞아요. 응원한 이야기는 맞지만 그 결과 팀이 이겼다는 것까지는 담지 못했어요.`},{text:`실수를 한 번 하면 경기에서 이기기 어렵다.`,correct:!1,rationale:`다른 방향이에요. 지문에서는 실수했지만 결국 팀이 승리했다고 했어요.`}]},{type:`main_idea`,id:`KOR4-MAIN-022`,difficulty:`hard`,paragraph:`옛날 사람들은 밤에 별을 보고 방향을 찾았다. 북쪽 하늘에 있는 북극성은 항상 같은 자리에 있어서 길잡이 역할을 했다. 지금도 캠핑을 갈 때 이 방법을 알아두면 유용하다.`,prompt:`이 글을 한 문장으로 요약한 것으로 가장 알맞은 것은 무엇일까요?`,options:[{text:`옛날부터 북극성은 방향을 찾는 데 쓰였고 지금도 유용하다.`,correct:!0,rationale:`정답이에요! 옛날의 쓰임과 오늘날의 쓰임을 모두 담은 요약이에요.`},{text:`북극성은 항상 같은 자리에 있다.`,correct:!1,rati
