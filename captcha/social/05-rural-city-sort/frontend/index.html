<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatChap · 촌락과 도시 구분 — 사회 CAPTCHA</title>
  <link rel="stylesheet" href="widget/catchap-social.css" />
  <style>
    :root {
      --purple: #8b7cf6; --purple-deep: #6c5ce7; --purple-soft: #ece7ff;
      --ink: #37324d; --ink-soft: #9a92b8; --green: #34c759;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #efeaff 0%, #fbf4ff 42%, #fff2e6 100%);
      min-height: 100vh;
    }
    .hd { display: flex; align-items: center; gap: 18px; padding: 16px 28px; background: rgba(255,255,255,.72); backdrop-filter: blur(6px); }
    .hd-quit { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e4dcfa; color: var(--ink-soft); font-weight: 700; padding: 10px 16px; border-radius: 12px; cursor: pointer; }
    .hd-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--purple); display: grid; place-items: center; font-size: 22px; }
    .hd-title b { font-size: 20px; } .hd-title span { display: block; font-size: 13px; color: var(--ink-soft); }
    .hd-prog { flex: 1; display: flex; align-items: center; gap: 12px; }
    .hd-prog small { font-weight: 800; }
    .hd-bar { flex: 1; height: 12px; background: var(--purple-soft); border-radius: 999px; overflow: hidden; }
    .hd-bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg,#b6a9fb,var(--purple-deep)); }
    .hd-pct { font-weight: 900; color: var(--purple-deep); }
    .hd-star { background: #ffe9b8; color: #b8860b; font-weight: 900; padding: 10px 18px; border-radius: 999px; }
    .tabs { display: flex; gap: 10px; padding: 10px 28px 0; flex-wrap: wrap; }
    .tab { background: #fff; border: 1px solid #e4dcfa; color: var(--ink-soft); font-weight: 800; padding: 9px 16px; border-radius: 12px; cursor: pointer; }
    .tab.on { background: var(--purple); color: #fff; border-color: var(--purple); }
    .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 22px; padding: 22px 28px 60px; max-width: 1400px; margin: 0 auto; }
    .main { background: #fff; border-radius: 28px; padding: 26px; box-shadow: 0 20px 50px rgba(108,92,231,.1); }
    .main-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--purple); color: #fff; font-weight: 800; padding: 6px 12px; border-radius: 10px; font-size: 13px; }
    .guard { display: inline-flex; align-items: center; gap: 8px; background: #d7f5df; color: #1f9d45; font-weight: 800; padding: 7px 14px; border-radius: 999px; font-size: 13px; }
    .guard::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .side { display: flex; flex-direction: column; gap: 18px; }
    .side-card { background: #fff; border-radius: 22px; padding: 20px; box-shadow: 0 12px 30px rgba(108,92,231,.08); }
    .mascot-card { background: linear-gradient(180deg,#d7ccfb,#c7b8f8); text-align: center; }
    .mascot { width: 96px; height: 96px; margin: 0 auto 10px; border-radius: 50%; background: #c0392b; display: grid; place-items: center; font-size: 46px; border: 5px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,.12); overflow: hidden; }
    .mascot-card p { font-weight: 900; margin: 0; }
    .side-title { font-weight: 900; margin: 0 0 14px; }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .stat .l { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; }
    .dot.g { background: var(--green); } .dot.r { background: #ff5a7a; } .dot.y { background: #ffb92e; }
    .stat .v { font-weight: 900; }
    .rewards { display: flex; gap: 8px; margin: 6px 0 10px; }
    .rw { flex: 1; aspect-ratio: 1; border-radius: 14px; background: #efeaff; display: grid; place-items: center; font-size: 22px; color: #c9bdf3; }
    .rw.on { background: #ddd3fb; color: var(--purple-deep); }
    .side-note { text-align: center; font-weight: 800; font-size: 14px; margin: 0; }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } .side { flex-direction: row; flex-wrap: wrap; } .side-card { flex: 1; min-width: 220px; } }
  </style>
</head>
<body>
  <header class="hd">
    <button class="hd-quit">✕ 그만하기</button>
    <div class="hd-icon">🏙️</div>
    <div class="hd-title"><b>촌락과 도시 구분</b><span>지역 생활 모습 나누기</span></div>
    <div class="hd-prog">
      <small>문제 <span id="hdQ">1</span> / 25</small>
      <div class="hd-bar"><i id="hdBar"></i></div>
      <span class="hd-pct" id="hdPct">4%</span>
    </div>
    <div class="hd-star">⭐ <span id="hdStar">120</span></div>
  </header>

  <nav class="tabs">
    <span class="tab">Aa 국어</span>
    <span class="tab">🔤 영어</span>
    <span class="tab">📐 수학</span>
    <span class="tab">⚗️ 과학</span>
    <span class="tab on">📜 역사</span>
    <span class="tab">🏠 생활</span>
  </nav>

  <div class="wrap">
    <section class="main">
      <div class="main-head">
        <span class="badge">🏙️ 지역·사회</span>
        <span class="guard">Guard 추적 중</span>
      </div>
      <!-- ★ 위젯이 여기에 마운트됩니다 (스크린샷의 'API 캡챠 위젯 자리') ★ -->
      <div id="captcha-mount"></div>

    </section>

    <aside class="side">
      <div class="side-card mascot-card">
        <div class="mascot">🐱</div>
        <p>지역을 잘 구분해요! 🏙️</p>
      </div>
      <div class="side-card">
        <p class="side-title">이번 판 진행</p>
        <div class="stat"><span class="l"><span class="dot g">✓</span> 맞힌 문제</span><span class="v" id="stO">0</span></div>
        <div class="stat"><span class="l"><span class="dot r">✕</span> 틀린 문제</span><span class="v" id="stX">0</span></div>
        <div class="stat"><span class="l"><span class="dot y">⚡</span> 연속 정답</span><span class="v" id="stC">0</span></div>
      </div>
      <div class="side-card">
        <p class="side-title">다음 보상까지 🎁 새 스티커</p>
        <div class="rewards" id="rewards">
          <span class="rw on">★</span><span class="rw">★</span><span class="rw">★</span><span class="rw">★</span><span class="rw">★</span>
        </div>
        <p class="side-note" id="rewardNote">별 4개만 더 모으면 새 스티커! 🎁</p>
      </div>
    </aside>
  </div>

  <script src="widget/catchap-social.js"></script>
  <script>
    let combo = 0, correctN = 0, wrongN = 0;
    CatChapSocial.mount('#captcha-mount', {
      apiBase: '/api/rural-city',
      onProgress(info) {
        document.getElementById('hdQ').textContent = Math.min(info.index + 2, info.total);
        const pct = Math.round(((info.index + 1) / info.total) * 100);
        document.getElementById('hdBar').style.width = pct + '%';
        document.getElementById('hdPct').textContent = pct + '%';
        if (info.correct) { correctN++; combo++; } else { wrongN++; combo = 0; }
        document.getElementById('stO').textContent = correctN;
        document.getElementById('stX').textContent = wrongN;
        document.getElementById('stC').textContent = combo;
        const stars = document.querySelectorAll('#rewards .rw');
        stars.forEach((s, i) => s.classList.toggle('on', i < Math.min(combo, 5)));
        const left = Math.max(0, 5 - combo);
        document.getElementById('rewardNote').textContent =
          left > 0 ? `별 ${left}개만 더 모으면 새 스티커! 🎁` : '새 스티커 획득! 🎉';
      },
      onPass(r) {
        document.getElementById('hdStar').textContent = 120 + r.totalCorrect * 10;
        console.log('✅ CAPTCHA 통과! 토큰:', r.token);
      },
      onFail(r) { console.log('❌ CAPTCHA 실패:', r.totalCorrect, '/', r.totalQuestions); },
    });
  </script>
</body>
</html>
